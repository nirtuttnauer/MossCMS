worker_processes 1;
error_log /tmp/moss-009-tls/nginx-error.log;
pid /tmp/moss-009-tls/nginx.pid;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format rehearsal '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
  access_log /tmp/moss-009-tls/access.log rehearsal;
  client_max_body_size 25m;
  client_body_temp_path /tmp/moss-009-tls/body;
  proxy_temp_path /tmp/moss-009-tls/proxy;
  fastcgi_temp_path /tmp/moss-009-tls/fastcgi;
  uwsgi_temp_path /tmp/moss-009-tls/uwsgi;
  scgi_temp_path /tmp/moss-009-tls/scgi;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host:$server_port;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Connection "";
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  server {
    listen 127.0.0.1:8443 ssl;
    server_name cms.moss.test;
    ssl_certificate /tmp/moss-009-tls/rehearsal.crt;
    ssl_certificate_key /tmp/moss-009-tls/rehearsal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    location / {
      proxy_pass http://127.0.0.1:8001;
    }
  }
}
