# Public delivery proxy. Allowlist: the request is forwarded only when the raw
# target and the method are both public. Everything else is 404 and is not proxied.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  default_type application/octet-stream;
  server_tokens off;
  merge_slashes on;
  client_max_body_size 25m;
  log_format moss '$remote_addr "$request_method $uri" $status';
  access_log /dev/stdout moss;

  # A non-empty override/rewrite header is rejected. An empty value means the header is absent.
  map $http_x_http_method_override $moss_bad_method { default 1; "" 0; }
  map $http_x_original_url $moss_bad_original { default 1; "" 0; }
  map $http_x_rewrite_url $moss_bad_rewrite { default 1; "" 0; }

  # Raw target, including the query string. Dots, traversal, encoded separators, and ';' never proxy.
  map $request_uri $moss_bad_uri {
    default 0;
    "~*%2e" 1;
    "~*%2f" 1;
    "~*%5c" 1;
    "~*%00" 1;
    "~*%3b" 1;
    "~*%252e" 1;
    "~*%252f" 1;
    "~*%2525" 1;
    "~*\.\." 1;
    "~*//" 1;
    "~*;" 1;
    "~*\." 1;
  }

  map "$moss_bad_uri$moss_bad_method$moss_bad_original$moss_bad_rewrite" $moss_reject {
    default 1;
    "0000" 0;
  }

  server {
    listen 8080;
    server_name _;

    if ($moss_reject) { return 404; }

    location = /health {
      if ($request_method != GET) { return 404; }
      proxy_pass http://app:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location = /delivery/graphql {
      if ($request_method != POST) { return 404; }
      proxy_pass http://app:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location /delivery/ {
      if ($request_method !~ ^(GET|HEAD)$) { return 404; }
      proxy_pass http://app:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location ~ "^/media/[0-9a-fA-F-]{36}/variant/[0-9]{1,5}$" {
      if ($request_method != GET) { return 404; }
      proxy_pass http://app:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location ~ "^/media/[0-9a-fA-F-]{36}$" {
      if ($request_method != GET) { return 404; }
      proxy_pass http://app:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location / {
      return 404;
    }
  }
}
