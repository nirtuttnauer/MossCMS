[project]
name = "mosscms-api"
version = "0.1.0"
description = "GraphQL-first self-hosted content API"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "authlib>=1.6,<2",
    "boto3>=1.40,<2",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "strawberry-graphql[fastapi]>=0.250.0",
    "uvicorn[standard]>=0.32.0",
    "pillow>=11.3,<13",
]

[dependency-groups]
dev = ["pytest>=8.3.3", "ruff>=0.12", "mypy>=1.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib.*", "boto3.*"]
ignore_errors = true
follow_untyped_imports = true
