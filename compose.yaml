services:
  app:
    extends:
      file: compose.database.${MOSS_USE_SQLITE:-false}.yaml
      service: app
    image: ${MOSS_IMAGE:-nirtuttnauer/mosscms:latest}
    build:
      context: .
      args:
        VITE_GRAPHQL_URL: /graphql
    environment:
      PORT: 8001
      MOSS_ENV: ${MOSS_ENV:-development}
      MOSS_USE_SQLITE: ${MOSS_USE_SQLITE:-false}
      MOSS_SKIP_AUTH: ${MOSS_SKIP_AUTH:-false}
      MOSS_SECRET_KEY: ${MOSS_SECRET_KEY:?Run python3 scripts/configure.py}
      MOSS_SETUP_TOKEN: ${MOSS_SETUP_TOKEN:?Run python3 scripts/configure.py}
      MOSS_PUBLIC_URL: ${MOSS_PUBLIC_URL:-http://localhost:8001}
      MOSS_ORIGINS: ${MOSS_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001,http://localhost:5173,http://127.0.0.1:5173}
      MOSS_WEBHOOK_ORIGINS: ${MOSS_WEBHOOK_ORIGINS:-}
      MOSS_OIDC_NAME: ${MOSS_OIDC_NAME:-Single sign-on}
      MOSS_OIDC_DISCOVERY_URL: ${MOSS_OIDC_DISCOVERY_URL:-}
      MOSS_OIDC_CLIENT_ID: ${MOSS_OIDC_CLIENT_ID:-}
      MOSS_OIDC_CLIENT_SECRET: ${MOSS_OIDC_CLIENT_SECRET:-}
      MOSS_GITHUB_CLIENT_ID: ${MOSS_GITHUB_CLIENT_ID:-}
      MOSS_GITHUB_CLIENT_SECRET: ${MOSS_GITHUB_CLIENT_SECRET:-}
      MOSS_S3_BUCKET: ${MOSS_S3_BUCKET:-}
      MOSS_S3_ENDPOINT: ${MOSS_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MOSS_OTEL_ENABLED: ${MOSS_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mosscms}
      MOSS_OTEL_TRACES_SAMPLE_RATE: ${MOSS_OTEL_TRACES_SAMPLE_RATE:-0.1}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
    ports:
      - "${MOSS_BIND_HOST:-127.0.0.1}:${MOSS_PORT:-8001}:8001"
    volumes:
      - moss_assets:/data
    tmpfs:
      - /tmp:size=64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  example-site:
    profiles: [website]
    build:
      context: .
      dockerfile: example-site/Dockerfile
    env_file:
      - ./example-site/.env
    environment:
      MOSS_API_URL: http://app:8001
      PORT: 5174
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  db:
    extends:
      file: compose.database.${MOSS_USE_SQLITE:-false}.yaml
      service: db
volumes:
  moss_data:
  moss_assets:
