name: Checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked --group dev
        working-directory: api
      - run: uv run ruff check app tests migrations && uv run ruff format --check app tests migrations
        working-directory: api
      - run: uv run mypy app
        working-directory: api
      - run: uv run pytest
        working-directory: api
  api_postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pgtestpw
          POSTGRES_USER: pg
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked --group dev
        working-directory: api
      - run: uv run pytest
        working-directory: api
        env:
          MOSS_TEST_DATABASE_URL: postgresql+psycopg://pg:pgtestpw@localhost:5432/postgres
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check && npm test && npm run build && npm audit --audit-level=high
        working-directory: web
  personal_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: personal-site/package-lock.json
      - run: npm ci
        working-directory: personal-site
      - run: npm run check && npm test && npm run build && npm audit --audit-level=high
        working-directory: personal-site
