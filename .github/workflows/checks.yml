name: Checks
on:
  push:
  pull_request:
  workflow_call:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked --group dev
        working-directory: api
      - run: uv run ruff check app tests migrations && uv run ruff format --check app tests migrations
        working-directory: api
      - name: Check operator, release, and website setup scripts
        run: |
          uv run ruff check --config pyproject.toml ../scripts ../example-site/scripts/setup_moss.py
          uv run ruff format --check --config pyproject.toml ../scripts ../example-site/scripts/setup_moss.py
          uv run ruff check --config pyproject.toml ../ci/telemetry_smoke.py
          uv run ruff format --check --config pyproject.toml ../ci/telemetry_smoke.py
        working-directory: api
      - run: uv run mypy app
        working-directory: api
      - run: uv run pytest -m "not postgres"
        working-directory: api
        env:
          MOSS_REQUIRED_RUN: sqlite
      - name: Verify OTLP exports with the pinned Collector
        working-directory: api
        run: |
          docker run --rm -d --name moss-otel-smoke \
            -p 127.0.0.1:14318:4318 -p 127.0.0.1:19464:9464 \
            -v "$GITHUB_WORKSPACE/ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108 \
            --config=/etc/otelcol/config.yaml
          trap 'docker rm -f moss-otel-smoke >/dev/null 2>&1 || true' EXIT
          MOSS_USE_SQLITE=false PYTHONPATH=. uv run python ../ci/telemetry_smoke.py \
            --endpoint http://127.0.0.1:14318 --metrics-url http://127.0.0.1:19464/metrics \
            --output /tmp/moss-otel-evidence/collector-smoke.json
  api_postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pgtestpw
          POSTGRES_USER: pg
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked --group dev
        working-directory: api
      - run: uv run pytest
        working-directory: api
        env:
          MOSS_REQUIRED_RUN: postgres
          MOSS_TEST_DATABASE_URL: postgresql+psycopg://pg:pgtestpw@localhost:5432/postgres
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check && npm test && npm run build && npm audit --audit-level=high
        working-directory: web
  example_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: example-site/package-lock.json
      - run: npm ci
        working-directory: example-site
      - run: npm run check && npm test && npm run build && npm audit --audit-level=high
        working-directory: example-site
  production_docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: npm ci
        working-directory: ci
      - run: npx playwright install --with-deps chromium
        working-directory: ci
      - name: Build production image
        run: docker build --tag mosscms:smoke .
      - name: Start isolated production stack
        run: docker compose -f ci/compose.yaml -p mosscms-smoke up --no-build -d --wait --wait-timeout 180
      - name: Check production login and branding
        run: npm test
        working-directory: ci
      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p ci/test-results
          docker compose -f ci/compose.yaml -p mosscms-smoke logs --no-color > ci/test-results/containers.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-smoke-results
          path: |
            ci/test-results/
            ci/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable production stack
        if: always()
        run: docker compose -f ci/compose.yaml -p mosscms-smoke down --volumes
