# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# Monthly version updates, one group per ecosystem, with a low open pull request
# limit. MOSS-004 covers only SECURITY.md.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/example-site"
      - "/ci"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/example-site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - "*"
