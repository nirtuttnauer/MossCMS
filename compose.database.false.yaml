# PostgreSQL mode (MOSS_USE_SQLITE=false or unset).
services:
  app:
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Run python3 scripts/configure.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run python3 scripts/configure.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run python3 scripts/configure.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run python3 scripts/configure.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py}
    volumes:
      - moss_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
