# Optional local Collector: docker compose -f compose.yaml -f compose.observability.yaml up --build -d
services:
  app:
    environment:
      MOSS_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${MOSS_OTEL_METRICS_PORT:-9464}:9464"
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"
